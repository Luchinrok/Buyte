<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Festuc">
  <!-- Variant maskable: fons pla i el festuc dins la zona segura del 80% perquè Android no el retalli -->
  <rect width="512" height="512" fill="#FAFAF7"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
  <g transform="translate(256 262) rotate(-30) scale(1.12) translate(-256 -262)">
    <!-- fruit verd, amb la pell violeta a la vora, que treu el cap per l'escletxa de la closca -->
    <!-- interior de la closca, que es veu entre les dues meitats -->
    <path d="M196 266 C 200 344 220 408 256 446 C 292 408 312 344 316 266 Z" fill="#C4A16A"/>
    <ellipse cx="256" cy="232" rx="74" ry="134" fill="#7a4a63"/>
    <ellipse cx="256" cy="228" rx="63" ry="122" fill="#8CBE3F"/>
    <ellipse cx="238" cy="176" rx="17" ry="44" fill="#b9de72"/>
    <!-- closca: dues meitats, oberta per dalt -->
    <path d="M256 446 C 166 446 110 366 110 266 C 110 176 156 112 212 96 C 196 146 192 206 196 266 C 200 344 220 408 256 446 Z" fill="#EAD7AE" stroke="#B48C52" stroke-width="11" stroke-linejoin="round"/>
    <path d="M256 446 C 346 446 402 366 402 266 C 402 176 356 112 300 96 C 316 146 320 206 316 266 C 312 344 292 408 256 446 Z" fill="#D8BD86" stroke="#B48C52" stroke-width="11" stroke-linejoin="round"/>
